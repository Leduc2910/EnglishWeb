      - "Assigned test cards"
      - "PDF viewer workspace"
      - "Audio player"
      - "Submission confirmation"
      - "Results table"
      - "Grading detail panel"

technical_requirements:
  platform:
    frontend: "web app, desktop/laptop-first"
    backend: "not yet specified"
    database: "not yet specified"

  integrations:
    - name: "File storage"
      purpose: "Store uploaded PDFs, Listening audio, and Speaking submissions."
      required: true
    - name: "Authentication"
      purpose: "Support teacher and student accounts with role-based access."
      required: true
    - name: "PDF rendering"
      purpose: "Show uploaded test PDFs by page inside student exam workspace."
      required: true
    - name: "Audio playback"
      purpose: "Play Listening audio for students and Speaking submissions for teachers."
      required: true

  data_models:
    - name: "User"
      fields: ["id", "role", "name", "email_or_username", "password_hash", "status"]
    - name: "Class"
      fields: ["id", "name", "class_code", "teacher_id", "status"]
    - name: "ClassMembership"
      fields: ["id", "class_id", "student_id", "status"]
    - name: "TestTemplate"
      fields: ["id", "teacher_id", "title", "skill", "description", "status"]
    - name: "TestMaterial"
      fields: ["id", "template_id", "type", "file_id", "filename", "status"]
    - name: "AnswerKey"
      fields: ["id", "template_id", "question_count", "scoring_mode", "total_score"]
    - name: "AnswerKeyRow"
      fields: ["id", "answer_key_id", "question_number", "correct_answer", "score"]
    - name: "HomeworkAssignment"
      fields: ["id", "template_id", "class_id", "assigned_by", "deadline", "time_limit_minutes", "status"]
    - name: "LiveExamSession"
      fields: ["id", "template_id", "class_id", "started_by", "scheduled_start", "scheduled_end", "opened_at", "closed_at", "status"]
    - name: "Submission"
      fields: ["id", "template_id", "homework_assignment_id", "live_exam_session_id", "student_id", "attempt_number", "mode", "status", "submitted_at", "auto_score"]
    - name: "SubmissionAnswer"
      fields: ["id", "submission_id", "question_number", "answer_value", "is_correct", "score"]
    - name: "SpeakingSubmission"
      fields: ["id", "submission_id", "file_id", "filename", "teacher_score", "teacher_feedback", "graded_at"]

  performance:
    - "Dashboard, test list, assigned tests, and results list should load initial content in under 2 seconds on normal broadband."
    - "Autosave answer changes should visibly acknowledge within 1 second when online."
    - "Large file upload must show progress and never leave the user guessing whether upload is active."

acceptance_criteria:
  functional:
    - "Teacher can log in, open Thư viện đề, create a reusable template, upload PDF, enter answer key/scoring, review, and mark the template ready."
    - "Teacher can create homework with a due date from a ready template."
    - "Teacher can create/open/close an in-class live exam session from a ready template."
    - "Homework and live exam sessions are visible only to assigned class/student context and allowed session state."
    - "Student must enter valid class code before student login."
    - "Student login preserves selected class context and verifies membership."
    - "Student can see homework and live exam items with clear type, Not started, In progress, Submitted, Not open, and Open now states."
    - "Student Reading/Listening workspace shows PDF, optional audio, answer form, progress, autosave state, and submit confirmation."
    - "Student Speaking workspace distinguishes uploaded draft from final submitted file."
    - "Teacher Results module filters by class, template, mode, student, skill, and status."
    - "Teacher can play Speaking file, enter score/feedback, save, and see row status update."

  non_functional:
    - "All core flows are keyboard accessible."
    - "Text contrast meets WCAG AA."
    - "Role-based access prevents teachers/students from viewing data outside their scope."
    - "Submission, mark-ready, homework creation, and live-session creation actions are protected against duplicate clicks."
    - "Answer drafts survive normal reload/network interruption scenarios where technically feasible."

  edge_cases:
    - "Invalid or expired class code -> show clear error and let student retry."
    - "Student account not in selected class -> block login to that class and explain next step."
    - "No assigned tests -> show calm empty state tied to active class."
    - "Live exam not opened yet -> show not-open state and block attempt start."
    - "Homework deadline passed -> show closed state and block new attempt."
    - "PDF upload fails -> keep draft and allow retry/replace."
    - "Answer key has missing answers -> block template-ready action until fixed."
    - "Student submits with missing answers -> show confirmation warning before final submit."
    - "Speaking file uploaded but not submitted -> keep status as draft, not submitted."
    - "Teacher opens missing Speaking file -> show recoverable error, do not lose grading context."

testing_guidance:
  user_testing:
    - "Time a teacher creating a reusable Reading template from prepared PDF and answer key; target under 10 minutes."
    - "Observe a student entering class code, logging in, finding homework/live exam work, entering answers, and submitting without verbal guidance."
    - "Observe a teacher filtering results and grading one Speaking submission end-to-end."

  qa_testing:
    - "Test teacher and student auth guards for direct route access."
    - "Test file upload success/failure/replacement for PDF and Speaking files."
    - "Test autosave, reload, offline/degraded warning, and final submission locking."
    - "Test result filters and master-detail grading save behavior."
    - "Test keyboard navigation and visible focus states across all forms and tables."

  design_validation:
    - "Match page-level object IDs and section hierarchy from the page specs."
    - "Preserve business distinction: Thư viện đề stores templates; Homework and Live Exam are separate usage modes."
    - "Preserve student safety cues: class confirmation, active class context, autosave state, and explicit submission success."

estimated_complexity:
  size: "large"
  effort: "4-6 weeks for MVP implementation depending on existing stack and auth/file infrastructure"
  risk: "medium"
  dependencies:
    - "Authentication and role model"
    - "Class and membership model"
    - "File storage and secure file access"
    - "PDF viewer implementation"
    - "Audio player implementation"
    - "Autosave/submission state model"

notes: |
  Scope boundaries are important:
  - MVP does not parse PDF into questions.
  - MVP does not auto-grade Speaking with AI.
  - MVP uses teacher-defined answer keys for Reading/Listening.
  - Export to Excel/PDF is deferred.
  - Design system mode is none, so implementation should extract reusable UI components pragmatically from repeated patterns rather than waiting on a formal component library.
