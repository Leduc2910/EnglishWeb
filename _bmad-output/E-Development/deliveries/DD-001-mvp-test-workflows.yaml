delivery:
  id: "DD-001"
  name: "MVP Test Workflows"
  type: "user_flow"
  status: "ready_for_handoff"
  priority: "high"
  created_by: "wds-ux-design"
  created_at: "2026-06-08T21:12:30+07:00"
  updated_at: "2026-06-08T21:12:30+07:00"
  version: "1.0"
  designer: "Đức + Freya"

description: |
  This delivery packages the complete MVP workflow for EnglishTestWeb:
  1. Teacher creates a reusable test template in the Question/Test Library from a PDF with answer key.
  2. Teacher uses that template either as Homework with a deadline or as an in-class Live Exam session.
  3. Student enters class by class code, logs in, completes homework or live exam work, and submits Speaking files.
  4. Teacher reviews results and grades Speaking in one focused results workspace.

  The delivery is intended to be handed to BMad architecture/development as the first implementation slice for the product.

user_value:
  problem: "Teachers need a faster, centralized way to create tests, collect submissions, auto-grade Reading/Listening, and manually grade Speaking without scattered files or manual score tracking."
  solution: "A role-based web workflow using class codes, reusable PDF/audio-based test templates, separate homework assignments and live exam sessions, answer forms, structured submissions, autosave, and a master-detail results/grading workspace."
  success_criteria:
    - "Teacher can create a reusable Reading template from PDF with answer key in under 10 minutes."
    - "Teacher can use a template to create either homework with a due date or an in-class live exam session."
    - "Student can enter the correct class, distinguish homework from live exam, complete work, and see clear submission confirmation without teacher guidance."
    - "Reading/Listening submissions are structured for auto-grading from teacher answer keys."
    - "Teacher can open a Speaking submission, play the file, enter score and feedback, and save grading in one screen."

