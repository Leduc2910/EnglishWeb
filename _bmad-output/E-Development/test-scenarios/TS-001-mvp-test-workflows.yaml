test_scenario:
  id: "TS-001"
  delivery_id: "DD-001"
  name: "MVP Test Workflows Validation"
  status: "draft"
  created_at: "2026-06-08T21:12:30+07:00"
  corrected_at: "2026-06-08T22:40:00+07:00"

objectives:
  - "Validate that the MVP supports teacher creation of reusable test templates from PDF/audio and answer keys."
  - "Validate that teachers can use a ready template as either Homework with due date or Live Exam session for in-class work."
  - "Validate that students can enter the correct class, distinguish Homework from Live Exam, complete allowed work, and receive clear submission confirmation."
  - "Validate that teachers can review results by class, template, and mode, then grade Speaking in one focused workspace."

happy_path_tests:
  - id: "HP-001"
    name: "Teacher creates reusable Reading template and selects use mode"
    design_refs:
      - "_bmad-output/C-UX-Scenarios/01-giao-vien-ban-ron-tao-bai-test-tu-pdf-audio/"
    steps:
      - action: "Teacher logs in."
        expected: "Teacher Dashboard appears."
      - action: "Teacher opens Thu vien de from navbar."
        expected: "Question/Test Library appears with create-template action."
      - action: "Teacher starts a new template and enters setup details."
        expected: "Setup validates template name and skill; class, deadline, and session timing are not requested here."
      - action: "Teacher uploads a valid Reading PDF."
        expected: "PDF upload succeeds and continue is enabled."
      - action: "Teacher enters question count, answers, and scoring."
        expected: "Answer key summary has no missing answers and valid score."
      - action: "Teacher reviews and marks template ready."
        expected: "Template status becomes ready and next actions appear: assign Homework or create Live Exam."
      - action: "Teacher assigns Homework from the ready template."
        expected: "Teacher can choose class and due date for the HomeworkAssignment."
      - action: "Teacher creates Live Exam session from the ready template."
        expected: "Teacher can choose class and open/close or schedule the LiveExamSession."

  - id: "HP-002"
    name: "Student completes Reading or Listening homework/live exam"
    design_refs:
      - "_bmad-output/C-UX-Scenarios/02-hoc-sinh-lam-bai-duoc-giao-trong-dung-lop/"
    steps:
      - action: "Student enters valid class code."
        expected: "Class confirmation card shows correct class."
      - action: "Student logs in with class context."
        expected: "Assigned Tests page opens for the selected class."
      - action: "Student opens an available Homework or Live Exam item."
        expected: "Exam workspace shows mode badge, PDF, answer panel, and audio player if Listening."
      - action: "Student enters answers."
        expected: "Progress and autosave state update."
      - action: "Student submits."
        expected: "Confirmation appears, then submitted success state locks answers."

  - id: "HP-003"
    name: "Student submits Speaking file for homework/live exam"
    design_refs:
      - "_bmad-output/C-UX-Scenarios/02-hoc-sinh-lam-bai-duoc-giao-trong-dung-lop/2.5-student-speaking-submission/"
    steps:
      - action: "Student opens assigned Speaking Homework or active Live Exam."
        expected: "Prompt, mode badge, and upload panel appear."
      - action: "Student uploads valid Speaking file."
        expected: "File card shows uploaded draft status."
      - action: "Student confirms final submission."
        expected: "Submitted success state shows filename and timestamp."

  - id: "HP-004"
    name: "Teacher grades Speaking submission"
    design_refs:
      - "_bmad-output/C-UX-Scenarios/03-giao-vien-ban-ron-xem-ket-qua-va-cham-speaking/"
    steps:
      - action: "Teacher opens Ket qua from navbar."
        expected: "Results & Grading workspace appears."
      - action: "Teacher filters to Speaking submissions needing grading."
        expected: "Matching result rows appear with class, template, and mode context."
      - action: "Teacher opens a row."
        expected: "Detail panel shows student, template, HomeworkAssignment or LiveExamSession context, and audio player."
      - action: "Teacher plays file, enters score and feedback, and saves."
        expected: "Save succeeds; row status updates to Da cham."

error_state_tests:
  - id: "ERR-001"
    trigger: "Student enters invalid class code."
    expected_error: "Khong tim thay lop voi ma nay. Kiem tra lai ma lop giao vien gui."
    recovery: "Student edits code and retries."
  - id: "ERR-002"
    trigger: "Student login account is not a member of selected class."
    expected_error: "Tai khoan nay chua thuoc lop da chon. Kiem tra lai voi giao vien."
    recovery: "Student changes class code or contacts teacher."
  - id: "ERR-003"
    trigger: "Teacher tries to continue without required template setup fields."
    expected_error: "Inline field errors for missing template name or skill."
    recovery: "Teacher completes missing fields."
  - id: "ERR-004"
    trigger: "PDF upload fails or wrong file type is selected."
    expected_error: "Chi ho tro file PDF or upload retry message."
    recovery: "Teacher selects a valid PDF and retries."
  - id: "ERR-005"
    trigger: "Answer key is incomplete."
    expected_error: "Cau {n} chua co dap an."
    recovery: "Teacher completes missing rows."
  - id: "ERR-006"
    trigger: "Speaking file upload is missing or invalid."
    expected_error: "Chon file noi truoc khi nop or format/size message."
    recovery: "Student selects a valid file."
  - id: "ERR-007"
    trigger: "Teacher tries to save invalid Speaking score."
    expected_error: "Nhap diem Speaking hop le."
    recovery: "Teacher enters score within configured range."
  - id: "ERR-008"
    trigger: "Student opens Homework after deadline."
    expected_error: "Homework da qua han nop."
    recovery: "Student returns to list or asks teacher for extension."
  - id: "ERR-009"
    trigger: "Student opens Live Exam before teacher opens the session."
    expected_error: "Bai thi truc tiep chua mo."
    recovery: "Student waits for teacher to open the session."

edge_case_tests:
  - id: "EDGE-001"
    case: "No homework or live exam is available for class."
    expected: "Assigned Tests shows empty state tied to active class, not a generic failure."
  - id: "EDGE-002"
    case: "Student reloads exam page after entering answers."
    expected: "Saved/local answers are restored where technically feasible and autosave status is clear."
  - id: "EDGE-003"
    case: "Student submits with unanswered questions."
    expected: "Confirmation modal warns about missing answers before final submit."
  - id: "EDGE-004"
    case: "Teacher double-clicks Mark Ready or Create Session."
    expected: "Only one state transition or session creation is processed."
  - id: "EDGE-005"
    case: "Teacher filters Results to no matches."
    expected: "Empty state appears with option to clear filters."
  - id: "EDGE-006"
    case: "Speaking file unavailable while grading."
    expected: "Recoverable file error appears without losing score/feedback draft."

design_system_validation:
  mode: "embedded"
  note: "Formal D-Design-System artifacts are not enabled. Validate repeated UI patterns against embedded page specs and object IDs."
  checks:
    - "Form labels, errors, and helper text are consistent across teacher/student auth."
    - "Primary/secondary/destructive actions are visually distinct."
    - "Wizard stepper is consistent across setup, materials, answer key, and review."
    - "Status badges use consistent labels for draft, ready, homework, live exam, not open, open now, submitted, needs grading, and graded."
    - "Spacing and typography follow token names documented in page specs."

accessibility_tests:
  - "All inputs have visible labels and programmatic labels."
  - "All buttons and links are reachable by keyboard."
  - "Focus order follows visual order in forms, wizard screens, exam workspace, and results detail panel."
  - "Error messages are announced or associated with fields."
  - "Color contrast meets WCAG AA."
  - "Audio controls are keyboard operable."
  - "Touch/click targets are at least 44x44px where applicable."

sign_off_criteria:
  pass_threshold: "100% of happy path and blocking error tests must pass before MVP sign-off."
  must_fix:
    - "Broken role-based access."
    - "Teacher cannot create and mark a reusable template ready."
    - "Teacher cannot create Homework or Live Exam from a ready template."
    - "Student cannot submit allowed Homework, Live Exam, or Speaking file."
    - "Live Exam can be accessed before teacher opens the session."
    - "Homework deadline logic allows invalid new attempts."
    - "Autosave/submission state loses entered answers in normal use."
    - "Teacher cannot save Speaking score and feedback."
    - "Keyboard-inaccessible critical flows."
  nice_to_fix:
    - "Minor copy polish."
    - "Small spacing mismatches that do not affect comprehension."
    - "Non-blocking dashboard metric presentation differences."
  approval_process: "Duc reviews implemented flows against this test scenario and page specs; BMad/dev resolves must-fix issues before moving to build next slice."
